name: Build & Deploy to Play Store

on:
  push:
    branches: [master]

# Prevent concurrent runs on the same branch
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version, Build & Submit
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Skip CI commits (version bumps) to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      # ─── Setup ───────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ─── Version Bump ───────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & generate changelog
        id: version
        run: |
          # Run commit-and-tag-version (dry-run first to check if there's a bump)
          if npx commit-and-tag-version --dry-run 2>&1 | grep -q "skip version bump"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ No version bump needed (no feat/fix commits)"
          else
            npx commit-and-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 Bumped to v$NEW_VERSION"
          fi

      - name: Push version commit & tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git push --follow-tags origin master

      # ─── GitHub Release ──────────────────────────────────
      - name: Extract changelog for release
        if: steps.version.outputs.skip != 'true'
        id: changelog
        run: |
          # Extract the latest version's changelog section
          VERSION=${{ steps.version.outputs.new_version }}
          # Get content between the first two version headers
          CHANGELOG=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file for GitHub release
          echo "$CHANGELOG" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: false

      # ─── EAS Build ───────────────────────────────────────
      - name: Setup EAS CLI
        if: steps.version.outputs.skip != 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (production)
        if: steps.version.outputs.skip != 'true'
        run: eas build --platform android --profile production --non-interactive --wait

      # ─── EAS Submit ──────────────────────────────────────
      - name: Write Google Service Account key
        if: steps.version.outputs.skip != 'true'
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > ./play-service-account.json

      - name: Submit to Play Store
        if: steps.version.outputs.skip != 'true'
        run: eas submit --platform android --profile production --latest --non-interactive

      - name: Cleanup service account key
        if: always()
        run: rm -f ./play-service-account.json
